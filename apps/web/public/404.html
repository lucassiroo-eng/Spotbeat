<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA routing fix for GitHub Pages — encodes the path as a query string
    // then index.html decodes it and restores history before React boots.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
